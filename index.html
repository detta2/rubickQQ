<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>rubickQQ — Solver Rubik 3x3, 4x4 & 5x5</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f0f0; color: #222; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 16px;
  }
  .app-header {
    width: 100%; max-width: 420px;
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand-name { font-weight: 800; font-size: 18px; letter-spacing: .5px; }
  .brand-name span { color: #e8a013; }
  #mini-cube { display: inline-flex; }
  .mode-tabs { display: flex; background: #e2e2e2; border-radius: 12px; padding: 3px; gap: 2px; }
  .mode-tab {
    border: none; background: none; padding: 8px 18px; border-radius: 10px;
    font-size: 14px; font-weight: 800; cursor: pointer; color: #777;
  }
  .mode-tab.active { background: #fff; color: #222; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
  .wrap { width: 100%; max-width: 420px; }
  .palette { display: flex; gap: 8px; justify-content: center; margin: 12px 0; }
  .btn {
    display: block; width: 100%; padding: 14px; margin: 8px 0;
    border: none; border-radius: 12px; font-size: 16px; font-weight: 700;
    cursor: pointer;
  }
  .btn-primary { background: #f2b13d; color: #000; }
  .btn-secondary { background: #fff; color: #222; border: 2px solid #333; }
  .btn:disabled { opacity: 0.4; }
  .btn-solve-big {
    display: block; width: 100%; padding: 13px; margin: 8px 0 10px;
    border: none; border-radius: 16px; font-size: 14px; font-weight: 700;
    cursor: pointer; background: #f2b13d; color: #231603;
    box-shadow: 0 8px 20px rgba(242,177,61,.45), inset 0 1px 0 rgba(255,255,255,.4);
  }
  .btn-solve-big:active { transform: scale(.98); }
  .btn-solve-big:disabled { opacity: 0.4; }
  .mini-links { display: flex; justify-content: center; gap: 28px; margin-bottom: 8px; }
  .link-btn {
    background: none; border: none; color: #999; font-size: 12px; font-weight: 600;
    cursor: pointer; padding: 6px 4px; text-decoration: underline; text-underline-offset: 3px;
  }
  .link-btn:disabled { opacity: 0.35; text-decoration: none; cursor: default; }
  .moves { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 12px 0; }
  .move {
    background: #fff; padding: 8px 14px; border-radius: 8px;
    font-family: monospace; font-size: 16px; font-weight: 700; border: 2px solid #333;
  }
  .move.done { background: #d4edda; }
  .move.current { background: #f2b13d; color: #000; border-color: #f2b13d; }
  .controls { display: flex; gap: 8px; justify-content: center; margin: 12px 0; }
  .controls .btn { width: auto; padding: 10px 20px; margin: 0; }
</style>
</head>
<body>
<header class="app-header">
  <div class="brand">
    <span id="mini-cube"></span>
    <span class="brand-name">rubick<span>QQ</span></span>
  </div>
  <nav class="mode-tabs">
    <button class="mode-tab active" id="tab-3x3">3×3</button>
    <button class="mode-tab" id="tab-4x4">4×4</button>
    <button class="mode-tab" id="tab-5x5">5×5</button>
  </nav>
</header>
<div class="wrap" id="view3">
  <div class="palette" id="palette3d"></div>
  <div style="background:#f0f0f0;border-radius:12px;"><div id="cube3d-paint" style="width:100%;height:320px;position:relative;touch-action:none;"></div></div>
  <button class="btn-solve-big" id="btn-solve-3d">solve</button>
  <div class="mini-links">
    <button class="link-btn" id="btn-back-paint" disabled>‹ back</button>
    <button class="link-btn" id="btn-shuffle-paint">shuffle</button>
    <button class="link-btn" id="btn-reset-paint">reset</button>
    <button class="link-btn" id="btn-blank-paint">blank</button>
  </div>
  <div id="solution3d" style="display:none;margin-top:16px;">
    <div style="background:#e8f5e9;border-radius:12px;padding:12px;text-align:center;margin-bottom:12px;">
      <div style="font-weight:800;color:#2e7d32;font-size:18px;letter-spacing:1px;">🎯 SIAP DISELESAIKAN!</div>
      <div id="step-counter" style="font-size:13px;color:#666;margin-top:4px;"></div>
    </div>
    <div style="display:flex;gap:8px;align-items:stretch;margin-bottom:12px;">
      <button class="btn btn-secondary" id="btn-prev3d" style="width:auto;padding:10px 16px;margin:0;white-space:nowrap;">◀ Back</button>
      <div id="step-instruction" style="flex:1;background:#fff;border:2px solid #333;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:12px;font-size:16px;font-weight:700;text-align:center;"></div>
      <button class="btn btn-primary" id="btn-next3d" style="width:auto;padding:10px 16px;margin:0;white-space:nowrap;">Next ▶</button>
    </div>
    <div class="moves" id="moves3d" style="max-height:120px;overflow-y:auto;"></div>
    <div class="controls">
      <button class="btn btn-primary" id="btn-play3d">▶ Putar Otomatis</button>
    </div>
  </div>
</div>

      <div id="step-instruction4" style="flex:1;background:#fff;border:2px solid #333;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:12px;font-size:16px;font-weight:700;text-align:center;"></div>
      <button class="btn btn-primary" id="btn-next4d" style="width:auto;padding:10px 16px;margin:0;white-space:nowrap;">Next ▶</button>

</div>

</div>

<script src="cubejs/cube.js"></script>
<script src="cubejs/solve.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
